# The test broker for test/fabric-nats.test.js (scripts/test-nats.sh). Not production. A connection without
# credentials is the unrestricted user `open`; `nopub` may not publish and `nosub` may not subscribe under ov.events.
# (the permissions-violation cases).
authorization {
  users = [
    { user: open, password: open }
    { user: nopub, password: nopub, permissions: { publish: { deny: ["ov.events.>"] } } }
    { user: nosub, password: nosub, permissions: { subscribe: { deny: ["ov.events.>"] } } }
  ]
}
no_auth_user: open
