# The cell's NATS for OpenVibe.Events (ADR-042 decisions 5-6): the nats-v1 TOPIC carrier (NATS Core) and the
# nats-js-v1 STREAM carrier (JetStream). Run as `nats-server -js -c /etc/nats/nats-server.conf` (the unit is
# OpenVibe.Host's openvibe-nats.service). Never the record: PostgreSQL is; losing this store loses latency, not events.
#
# Loopback only (put the private-network address here instead for a multi-host cell, and firewall 4222 to the cell's
# hosts). No monitoring port, no cluster, no leafnodes.
host: 127.0.0.1
port: 4222
max_payload: 1MB

jetstream {
  store_dir: "/var/lib/nats"
  max_memory_store: 256MB
  max_file_store: 4GB
}

# One user for Events. The password comes from the environment of the unit (NATS_EVENTS_PASSWORD, e.g. from an
# EnvironmentFile readable only by the nats user), never from this file; Events gets it in NATS_URL
# (nats://events:<password>@127.0.0.1:4222). The user may use its own subjects (NATS_SUBJECT_PREFIX, default
# ov.events.: the topic subject, the stream's subjects, its consumers' deliver subjects and its request inboxes) and
# exactly the JetStream API and ack subjects of its one stream (NATS_STREAM, default OV_EVENTS_STREAM).
authorization {
  users = [
    {
      user: events
      password: $NATS_EVENTS_PASSWORD
      permissions: {
        publish: [
          "ov.events.>"
          "$JS.API.STREAM.INFO.OV_EVENTS_STREAM"
          "$JS.API.STREAM.CREATE.OV_EVENTS_STREAM"
          "$JS.API.CONSUMER.CREATE.OV_EVENTS_STREAM.>"
          "$JS.API.CONSUMER.DELETE.OV_EVENTS_STREAM.>"
          "$JS.ACK.OV_EVENTS_STREAM.>"
        ]
        subscribe: ["ov.events.>"]
      }
    }
  ]
}
