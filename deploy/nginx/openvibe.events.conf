## ═══════════════════════════════════════════════════════════════
## openvibe.events — Nginx Configuration (REFERENCE)
##
## Deployed to /etc/nginx/sites-available/openvibe.events.conf — keep them in sync,
## and reload nginx after changing it.
##
## The product domain (plan expansion II): openvibe.events serves the product home page and its
## discovery files. The API, the realtime gateway and health stay at events.openvibe.network (the
## vhost of the same name, deploy/nginx/events.openvibe.network.conf), and every other path here
## redirects there. Installed when openvibe.events is cut over from its OpenVibe.Sites placeholder:
## the Sites vhost of the same name is replaced; nothing else changes on events.openvibe.network.
##
## The Node service (port 4300, systemd unit openvibe-events) answers here:
##   /                  the product home (server/home.js) for a browser, the text/plain API index otherwise
##   /shared/           the OpenVibe Frame's pinned browser files (openvibe-shared/serve)
##   /robots.txt, /sitemap.xml, /llms.txt
##                      discovery for the product domain (server/discovery.js)
##   /metrics           host-local scrapers only (http://127.0.0.1:4300/metrics, never proxied)
##   /internal/         host-local service endpoints, refused here
## ═══════════════════════════════════════════════════════════════

# ── HTTP → HTTPS redirect ──────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name openvibe.events www.openvibe.events;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://openvibe.events$request_uri; }
}

# ── www → apex ─────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.openvibe.events;

    ssl_certificate     /etc/letsencrypt/live/openvibe.events/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openvibe.events/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    return 301 https://openvibe.events$request_uri;
}

# ── HTTPS server ───────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name openvibe.events;

    ssl_certificate     /etc/letsencrypt/live/openvibe.events/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openvibe.events/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/openvibe.events.access.log;
    error_log  /var/log/nginx/openvibe.events.error.log;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Metrics are for host-local scrapers only (http://127.0.0.1:4300/metrics).
    location = /metrics { return 404; }

    # Internal service endpoints (Live's /internal/media-events, ...) live on the API host.
    location /internal/ { return 404; }

    # ── The product surface: the home, its Frame files and its discovery files ──
    # Client address from $remote_addr only on every proxied location (never appended to, never
    # passed through), exactly as on events.openvibe.network.
    location = / {
        proxy_pass http://127.0.0.1:4300;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header CF-Connecting-IP $remote_addr;
    }

    location ^~ /shared/ {
        proxy_pass http://127.0.0.1:4300;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header CF-Connecting-IP $remote_addr;
    }

    location = /robots.txt {
        proxy_pass http://127.0.0.1:4300;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header CF-Connecting-IP $remote_addr;
    }

    location = /sitemap.xml {
        proxy_pass http://127.0.0.1:4300;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header CF-Connecting-IP $remote_addr;
    }

    location = /llms.txt {
        proxy_pass http://127.0.0.1:4300;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header CF-Connecting-IP $remote_addr;
    }

    # ── Everything else is the API host: the JSON API, realtime and health live there ──
    location / { return 301 https://events.openvibe.network$request_uri; }
}
