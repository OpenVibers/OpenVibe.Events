## ═══════════════════════════════════════════════════════════════
## openvibe.events — Nginx Configuration (REFERENCE)
##
## Deployed to /etc/nginx/sites-available/openvibe.events.conf — keep them in sync,
## and reload nginx after changing it.
##
## openvibe.events is the API and product origin (plan T7): the same Node service (port 4300,
## systemd unit openvibe-events) answers the product home and its discovery files, the
## token-guarded JSON API, the realtime gateway and health, all here. events.openvibe.network
## keeps answering the same surface unchanged (deploy/nginx/events.openvibe.network.conf) until
## every client has moved; a later change turns it into a redirect (308) to this host.
##
## The Node service (port 4300) answers here:
##   /                  the product home (server/home.js) for a browser, the text/plain API index otherwise
##   /shared/           the OpenVibe Frame's pinned browser files (openvibe-shared/serve)
##   /robots.txt, /sitemap.xml, /llms.txt
##                      discovery for the product domain (server/discovery.js)
##   /realtime/stream   browser Server-Sent Events (long-lived; must not be buffered)
##   /api/health, /api/ready, /release.json, /limits.json
##   /api/v1/events, /api/v1/subscriptions, /api/v1/checkpoints
##                      public, token-guarded: developer apps (events.app.* capabilities, ADR-014)
##                      and off-host services. Every request needs a Network token.
##   /api/v1/deliveries operators only (events.delivery.admin): host-local, refused here.
##                      Services on this host call 127.0.0.1:4300 directly.
##   /metrics           host-local scrapers only (http://127.0.0.1:4300/metrics, never proxied)
##   /internal/         host-local service endpoints, refused here
## ═══════════════════════════════════════════════════════════════

# Distinct zone names: events.openvibe.network.conf declares its own and both files load in one config.
limit_req_zone $binary_remote_addr zone=ovevents_apex_connect:10m rate=2r/s;
limit_conn_zone $binary_remote_addr zone=ovevents_apex_streams:10m;
limit_req_zone $binary_remote_addr zone=ovevents_apex_api:10m rate=20r/s;

# ── HTTP → HTTPS redirect ──────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name openvibe.events www.openvibe.events;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://openvibe.events$request_uri; }
}

# ── www → apex ─────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.openvibe.events;

    ssl_certificate     /etc/letsencrypt/live/openvibe.events/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openvibe.events/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    return 301 https://openvibe.events$request_uri;
}

# ── HTTPS server ───────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name openvibe.events;

    ssl_certificate     /etc/letsencrypt/live/openvibe.events/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openvibe.events/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/openvibe.events.access.log;
    error_log  /var/log/nginx/openvibe.events.error.log;

    client_max_body_size 2m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ── Realtime (SSE): no buffering, no compression, long reads ──
    # The service sends a heartbeat comment every 25 s, well inside these timeouts and
    # Cloudflare's 100 s idle limit. CORS is answered by the service (https://*.openvibe.* only).
    location = /realtime/stream {
        access_log /var/log/nginx/openvibe.events.access.log ov_events_noquery;   # never the ?ticket= (log_format_events_noquery.conf)
        limit_req  zone=ovevents_apex_connect burst=20 nodelay;
        limit_conn ovevents_apex_streams 20;
        proxy_pass http://127.0.0.1:4300;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Last-Event-ID $http_last_event_id;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        chunked_transfer_encoding on;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        send_timeout 1h;
    }

    # The client address comes from $remote_addr only on every proxied location: never appended to,
    # never passed through. X-Forwarded-For on every API location: the service treats a request without it from
    # 127.0.0.1 as a local caller (GET /metrics answers only those).
    location = /api/health   { proxy_pass http://127.0.0.1:4300; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $remote_addr; proxy_set_header CF-Connecting-IP $remote_addr; }
    location = /api/ready    { proxy_pass http://127.0.0.1:4300; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $remote_addr; proxy_set_header CF-Connecting-IP $remote_addr; }
    location = /release.json { proxy_pass http://127.0.0.1:4300; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $remote_addr; proxy_set_header CF-Connecting-IP $remote_addr; }
    location = /limits.json  { proxy_pass http://127.0.0.1:4300; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $remote_addr; proxy_set_header CF-Connecting-IP $remote_addr; }

    # Metrics are for host-local scrapers only (http://127.0.0.1:4300/metrics).
    location ~* ^/metrics(/|$) { return 404; }

    # Internal service endpoints (Live's /internal/media-events, ...) are host-local.
    location ~* ^/internal(/|$) { return 404; }

    # ── Token-guarded API for developer apps (see header) ──
    # Per-project quotas are enforced by the service; this only caps per-IP request rates.
    location ~ ^/api/v1/(events|subscriptions|checkpoints)(/|$) {
        limit_req zone=ovevents_apex_api burst=40 nodelay;
        proxy_pass http://127.0.0.1:4300;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Everything else under /api/: host-local only (see header) ──
    location /api/ {
        return 403;
        # To expose it (token-guarded) to off-host services instead:
        # proxy_pass http://127.0.0.1:4300;
        # proxy_http_version 1.1;
        # proxy_set_header Host $host;
        # proxy_set_header X-Real-IP $remote_addr;          # client address from $remote_addr only (realip),
        # proxy_set_header X-Forwarded-For $remote_addr;    # never appended to or passed through
        # proxy_set_header CF-Connecting-IP $remote_addr;
        # proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── The product surface: the home, its Frame files and its discovery files ──
    location = / {
        proxy_pass http://127.0.0.1:4300;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header CF-Connecting-IP $remote_addr;
    }

    location ^~ /shared/ {
        proxy_pass http://127.0.0.1:4300;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header CF-Connecting-IP $remote_addr;
    }

    location = /robots.txt {
        proxy_pass http://127.0.0.1:4300;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header CF-Connecting-IP $remote_addr;
    }

    location = /sitemap.xml {
        proxy_pass http://127.0.0.1:4300;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header CF-Connecting-IP $remote_addr;
    }

    location = /llms.txt {
        proxy_pass http://127.0.0.1:4300;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header CF-Connecting-IP $remote_addr;
    }

    # ── Everything else: the app answers GET/HEAD (its /favicon.ico, and its own 404 page for browsers or a
    #    problem+json for API clients, both with lang and the Frame); other methods are refused here ──
    location / {
        limit_except GET HEAD { deny all; }
        proxy_pass http://127.0.0.1:4300;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
