# Install as /etc/nginx/conf.d/log_format_events_noquery.conf (conf.d loads before the vhosts).
# Access log lines without the query string for /realtime/stream: its ?ticket= is a single-use realtime
# ticket (ADR-005 amendment 2). Live keeps its own ov_noquery for its WebSocket URLs.
log_format ov_events_noquery '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent "$http_referer" "$http_user_agent" cf_ray=$http_cf_ray';
