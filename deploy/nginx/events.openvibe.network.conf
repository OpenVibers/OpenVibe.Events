## ═══════════════════════════════════════════════════════════════
## events.openvibe.network — Nginx Configuration (REFERENCE)
##
## Deployed to /etc/nginx/sites-available/events.openvibe.network.conf — keep them in sync,
## and reload nginx after changing it.
##
## OpenVibe.Events' API, realtime stream and product home are on https://openvibe.events
## (deploy/nginx/openvibe.events.conf, plan T7). This old name answers 308 to the same path and query
## there: a 308 keeps the method and the body, so a POST to /api/v1/events is replayed as a POST.
## Services on this host never come through here: they call 127.0.0.1:4300 directly.
## ═══════════════════════════════════════════════════════════════

server {
    listen 80;
    listen [::]:80;
    server_name events.openvibe.network;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 308 https://openvibe.events$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name events.openvibe.network;

    ssl_certificate     /etc/letsencrypt/live/openvibe.network/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openvibe.network/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/events.openvibe.network.access.log;
    error_log  /var/log/nginx/events.openvibe.network.error.log;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / { return 308 https://openvibe.events$request_uri; }
}
