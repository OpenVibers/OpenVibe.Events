## ═══════════════════════════════════════════════════════════════
## events.openvibe.network — Nginx Configuration (REFERENCE)
##
## Deployed to /etc/nginx/sites-available/events.openvibe.network.conf — keep them in sync,
## and reload nginx after changing it.
##
## The Node service (port 4300, systemd unit openvibe-events) serves:
##   /realtime/stream   browser Server-Sent Events (long-lived; must not be buffered)
##   /api/health, /api/ready, /release.json
##   /metrics           Prometheus text, answered only to direct loopback callers (never proxied)
##   /api/v1/events, /api/v1/subscriptions, /api/v1/checkpoints
##                      public, token-guarded: developer apps (events.app.* capabilities, ADR-014)
##                      and off-host services. Every request needs a Network token.
##   /api/v1/deliveries operators only (events.delivery.admin): host-local, refused here.
##                      Services on this host call 127.0.0.1:4300 directly.
## ═══════════════════════════════════════════════════════════════

limit_req_zone $binary_remote_addr zone=ovevents_connect:10m rate=2r/s;
limit_conn_zone $binary_remote_addr zone=ovevents_streams:10m;
limit_req_zone $binary_remote_addr zone=ovevents_api:10m rate=20r/s;

# ── HTTP → HTTPS redirect ──────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name events.openvibe.network;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://events.openvibe.network$request_uri; }
}

# ── HTTPS server ───────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name events.openvibe.network;

    ssl_certificate     /etc/letsencrypt/live/openvibe.network/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openvibe.network/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/events.openvibe.network.access.log;
    error_log  /var/log/nginx/events.openvibe.network.error.log;

    client_max_body_size 2m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ── Realtime (SSE): no buffering, no compression, long reads ──
    # The service sends a heartbeat comment every 25 s, well inside these timeouts and
    # Cloudflare's 100 s idle limit. CORS is answered by the service (https://*.openvibe.* only).
    location = /realtime/stream {
        limit_req  zone=ovevents_connect burst=20 nodelay;
        limit_conn ovevents_streams 20;
        proxy_pass http://127.0.0.1:4300;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Last-Event-ID $http_last_event_id;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        chunked_transfer_encoding on;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        send_timeout 1h;
    }

    # X-Forwarded-For on every proxied location: the service treats a request without it from
    # 127.0.0.1 as a local caller (GET /metrics answers only those).
    location = /api/health   { proxy_pass http://127.0.0.1:4300; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $remote_addr; proxy_set_header CF-Connecting-IP $remote_addr; }
    location = /api/ready    { proxy_pass http://127.0.0.1:4300; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $remote_addr; proxy_set_header CF-Connecting-IP $remote_addr; }
    location = /release.json { proxy_pass http://127.0.0.1:4300; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $remote_addr; proxy_set_header CF-Connecting-IP $remote_addr; }

    # Metrics are for host-local scrapers only (http://127.0.0.1:4300/metrics).
    location = /metrics { return 404; }

    # ── Token-guarded API for developer apps (see header) ──
    # Per-project quotas are enforced by the service; this only caps per-IP request rates.
    location ~ ^/api/v1/(events|subscriptions|checkpoints)(/|$) {
        limit_req zone=ovevents_api burst=40 nodelay;
        proxy_pass http://127.0.0.1:4300;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Everything else under /api/: host-local only (see header) ──
    location /api/ {
        return 403;
        # To expose it (token-guarded) to off-host services instead:
        # proxy_pass http://127.0.0.1:4300;
        # proxy_http_version 1.1;
        # proxy_set_header Host $host;
        # proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = / {
        proxy_pass http://127.0.0.1:4300;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header CF-Connecting-IP $remote_addr;
    }

    location / {
        return 404;
    }
}
