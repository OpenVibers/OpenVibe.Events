name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  # install, node --check, npm test and openvibe-contracts-check: the shared test job (Track Q).
  test:
    uses: OpenVibers/OpenVibe.Shared/.github/workflows/test.yml@423fe519b5fe9594cc81b670e5ba5cb9f21f6176
    with:
      contracts-service: events
      # ADR-035: PostgreSQL 18 + PgBouncer (transaction mode) + Valkey 9 containers (openvibe-sdk
      # scripts/test-services.sh). npm test runs every file on PGlite; test:pg runs them all through PgBouncer.
      # A NATS Core container (scripts/test-nats.sh) backs the optional nats-v1 TOPIC carrier's tests.
      test: 'npm test'
  # The same files through PostgreSQL + PgBouncer + Valkey, on a runner of its own so the two passes run at once
  # (plan §AD.13 (3): both in one job, one file at a time, made CI slow).
  test-pg:
    uses: OpenVibers/OpenVibe.Shared/.github/workflows/test.yml@423fe519b5fe9594cc81b670e5ba5cb9f21f6176
    with:
      syntax-dirs: ''
      pin-drift: false
      test: 'eval "$(node_modules/openvibe-sdk/scripts/test-services.sh up)" && eval "$(bash scripts/test-nats.sh up)" && npm run test:pg'
  # Secret scan (gitleaks) and dependency audit, shared by every OpenVibers repo (Track Q).
  security:
    uses: OpenVibers/OpenVibe.Shared/.github/workflows/security.yml@8a353d9e7557bfeed2b43deb51271171f8e48fc6
